<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - OCEAN SEAFOOD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/products.js"></script>
</head>
<body>

  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <h1 id="page-title">Đăng nhập</h1>
      <p>Chào mừng bạn quay lại OCEAN SEAFOOD</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <!-- auth.js sẽ thay nội dung này bằng khung "Tài khoản của tôi" nếu đã đăng nhập -->
      <div class="auth-box" id="auth-content">
        <div class="form-box">
          <h2>Đăng nhập</h2>

          <form id="login-form" novalidate>
            <div class="form-group" id="group-email">
              <label for="email">Email <span class="required">*</span></label>
              <input type="email" id="email" placeholder="ten@example.com" autocomplete="email">
              <div class="error-message"></div>
            </div>

            <div class="form-group" id="group-password">
              <label for="password">Mật khẩu <span class="required">*</span></label>
              <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
              <div class="error-message"></div>
            </div>

            <label class="filter-check" style="margin-bottom:18px">
              <input type="checkbox" id="show-password"> Hiện mật khẩu
            </label>

            <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>

            <div class="info-box">
              Đây là chức năng mô phỏng, chỉ đăng nhập được bằng tài khoản
              bạn đã <a href="register.html" style="color:var(--color-primary); font-weight:600">đăng ký</a>
              trên chính trình duyệt này.
            </div>
          </form>

          <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/sound-fx.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
