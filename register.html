<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - OCEAN SEAFOOD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/products.js"></script>
</head>
<body>

  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <h1>Đăng ký tài khoản</h1>
      <p>Tạo tài khoản mẫu để điền thông tin nhanh hơn khi đặt hàng và đặt bàn</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="auth-box" id="auth-content">
        <div class="form-box">
          <h2>Tạo tài khoản mới</h2>

          <form id="register-form" novalidate>
            <div class="form-group" id="group-name">
              <label for="full-name">Họ và tên <span class="required">*</span></label>
              <input type="text" id="full-name" placeholder="Nguyễn Văn A" autocomplete="name">
              <div class="error-message"></div>
            </div>

            <div class="form-group" id="group-email">
              <label for="email">Email <span class="required">*</span></label>
              <input type="email" id="email" placeholder="ten@example.com" autocomplete="email">
              <div class="error-message"></div>
            </div>

            <div class="form-group" id="group-phone">
              <label for="phone">Số điện thoại <span class="required">*</span></label>
              <input type="tel" id="phone" placeholder="0901234567" autocomplete="tel">
              <div class="error-message"></div>
            </div>

            <div class="form-group" id="group-password">
              <label for="password">Mật khẩu <span class="required">*</span></label>
              <input type="password" id="password" placeholder="Ít nhất 6 ký tự, gồm chữ và số" autocomplete="new-password">
              <div class="error-message"></div>
            </div>

            <div class="form-group" id="group-confirm">
              <label for="confirm-password">Xác nhận mật khẩu <span class="required">*</span></label>
              <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
              <div class="error-message"></div>
            </div>

            <label class="filter-check" style="margin-bottom:18px">
              <input type="checkbox" id="show-password"> Hiện mật khẩu
            </label>

            <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>

            <div class="info-box">
              Đây là chức năng mô phỏng. <strong>Không dùng mật khẩu thật</strong> của bạn
              (ví dụ mật khẩu email hay ngân hàng). Hãy dùng mật khẩu thử như <strong>Test1234</strong>.
            </div>
          </form>

          <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/sound-fx.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
